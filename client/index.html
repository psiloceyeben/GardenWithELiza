<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Pons Garden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#181220; --panel:#2a1f33; --panel2:#3a2c45; --edge:#bc8c5a; --text:#f0e8d2; --sap:#f0c434; --dim:#a898b8; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; height:100%; background:var(--ink); color:var(--text); font-family:'Press Start 2P', monospace; font-size:10px; overflow:hidden; touch-action:none; }
    #game { position:fixed; inset:0; }
    #game canvas { image-rendering:pixelated; image-rendering:crisp-edges; }
    button { font-family:inherit; font-size:9px; color:var(--text); background:var(--panel2); border:2px solid var(--edge); padding:7px 8px; cursor:pointer; box-shadow:2px 2px 0 #000; }
    button:active { transform:translate(1px,1px); box-shadow:1px 1px 0 #000; }
    button:disabled { opacity:.45; cursor:default; }
    input { font-family:inherit; font-size:9px; color:var(--text); background:#120c18; border:2px solid var(--edge); padding:7px 8px; outline:none; }
    #hud { position:fixed; top:64px; left:8px; background:rgba(24,18,32,.85); border:2px solid var(--edge); padding:7px 9px; line-height:1.8; pointer-events:none; max-width:46vw; }
    #hud .sap { color:var(--sap); }
    #hud .dim { color:var(--dim); font-size:7px; }
    #carry { color:#ff8080; font-size:7px; }
    #feed { position:fixed; top:64px; right:8px; width:min(44vw,300px); pointer-events:none; font-size:7px; line-height:1.6; }
    .fe { background:rgba(24,18,32,.85); border-left:3px solid var(--edge); padding:4px 6px; margin-bottom:3px; }
    .fe-steal { border-color:#ff5555; } .fe-tag { border-color:#6cd46c; } .fe-gate, .fe-break { border-color:var(--sap); } .fe-reveal { border-color:#c26bff; } .fe-join { border-color:#8fc3ff; }
    #chatlog { position:fixed; left:8px; bottom:calc(58px + env(safe-area-inset-bottom)); font-size:7px; line-height:1.7; pointer-events:none; max-width:60vw; }
    #chatlog div { background:rgba(24,18,32,.8); padding:3px 6px; margin-top:2px; }
    #chatlog b { color:var(--sap); }
    #chat { position:fixed; left:8px; bottom:calc(30px + env(safe-area-inset-bottom)); width:min(60vw,260px); opacity:.6; }
    #chat:focus { opacity:1; }
    #bar { position:fixed; bottom:calc(6px + env(safe-area-inset-bottom)); right:8px; display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
    /* Compact controls: the world is the point, the bar is not. */
    #bar button { font-size:8px; padding:5px 7px; box-shadow:1px 1px 0 #000; }
  /* Ready state: the claim is the one button worth interrupting somebody for. */
  #btn-daily.ready { background:#8cd25a; color:#12220a; animation:dailypulse 1.8s ease-in-out infinite; }
  @keyframes dailypulse { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.35)} }
    #panel { position:fixed; left:50%; bottom:calc(48px + env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(96vw,560px); max-height:66vh; overflow:auto; background:var(--panel); border:3px solid var(--edge); box-shadow:4px 4px 0 #000; padding:10px; z-index:5; }
    #panel[hidden] { display:none; }
    /* Avoid incorrect opaque-overlay occlusion over CSS-scaled WebGL canvases
       in Chromium. Fractional opacity keeps this panel on a blended layer. */
    #panel { opacity:.999; }
    #panel h2 { margin:0 0 8px; font-size:10px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    #panel h2 button { padding:4px 8px; }
    .slots { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; }
    .slot { background:var(--panel2); border:2px solid #000; padding:6px; display:grid; grid-template-columns:36px 1fr; gap:6px; align-items:center; }
    .slot.sold { opacity:.4; }
    .icon { width:32px; height:48px; background-image:url('sprites/plants.png'); background-repeat:no-repeat; image-rendering:pixelated; }
    .slot .name, .item .name { font-size:8px; line-height:1.5; }
    .slot .tier { font-size:7px; }
    .slot .buy, .item .buy { grid-column:1 / -1; display:flex; justify-content:space-between; align-items:center; gap:6px; }
    .item { background:var(--panel2); border:2px solid #000; padding:6px; margin-bottom:6px; display:grid; gap:4px; }
    .price { color:var(--sap); font-size:8px; }
    .seeds { display:flex; flex-wrap:wrap; gap:8px; }
    .seed { background:var(--panel2); border:2px solid #000; padding:6px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; width:100px; font-size:7px; text-align:center; }
    .seed.sel { border-color:var(--sap); }
    .row { display:flex; justify-content:space-between; padding:3px 0; font-size:8px; }
    .note { color:var(--dim); font-size:7px; line-height:1.6; margin-top:4px; }
    .emotes { display:flex; gap:8px; flex-wrap:wrap; } .emotes button { font-size:18px; }
    .wallets { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:8px 0; }
    .wallets button { width:100%; }
    .wallet-missing { font-size:7px; color:var(--dim); padding:6px; border:2px dashed #000; }
    .wallet-missing a { color:var(--sap); }
    #banner { position:fixed; top:40px; left:50%; transform:translateX(-50%); background:rgba(60,40,20,.92); border:2px solid var(--sap); color:var(--sap); padding:6px 12px; font-size:8px; text-align:center; pointer-events:none; z-index:6; line-height:1.6; }
    #banner[hidden] { display:none; }
    #toast { position:fixed; top:64px; left:50%; transform:translateX(-50%); background:rgba(24,18,32,.92); border:2px solid var(--edge); padding:8px 12px; font-size:8px; max-width:70vw; text-align:center; transition:opacity .3s; opacity:0; pointer-events:none; line-height:1.6; z-index:6; }
    #toast.on { opacity:1; }
    /* Natural-height rows prevent feed/event/notice collisions at every width,
       including desktop feeds that grow to several wrapped entries. */
    #status-stack { position:fixed; top:calc(64px + env(safe-area-inset-top));   /* clears the two-row ticker; #hud is position:static inside this grid, so the offset MUST live here */ left:8px; right:8px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:6px; pointer-events:none; z-index:6; }
    #status-stack > #hud, #status-stack > #feed, #status-stack > #banner, #status-stack > #toast { position:static; transform:none; min-width:0; max-width:100%; overflow-wrap:anywhere; }
    #status-stack > #hud { align-self:start; justify-self:start; width:fit-content; }
    #status-stack > #feed { align-self:start; justify-self:end; width:min(100%,300px); }
    #status-stack > #banner, #status-stack > #toast { grid-column:1 / -1; justify-self:center; width:fit-content; max-width:min(100%,900px); }
    @media (max-width:600px) {
      #status-stack > #feed .fe:not(:first-child) { display:none; }
    }
    #modal, #name-modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:10; }
    #modal[hidden], #name-modal[hidden] { display:none; }
    .card { background:var(--panel); border:3px solid var(--sap); box-shadow:6px 6px 0 #000; padding:16px; width:min(92vw,360px); text-align:center; }
    .card .icon { margin:8px auto 60px; transform:scale(2); transform-origin:center top; }
    .card h3 { font-size:11px; margin:6px 0; line-height:1.6; }
    .card p { font-size:8px; margin:4px 0; line-height:1.7; }
    .card input { width:100%; margin:10px 0; text-align:center; }
    #joy { position:fixed; left:14px; bottom:calc(90px + env(safe-area-inset-bottom)); width:96px; height:96px; border-radius:50%; background:rgba(24,18,32,.5); border:2px solid var(--edge); z-index:4; }
    #joy[hidden], #act[hidden] { display:none; }
    #joy-knob { position:absolute; left:28px; top:28px; width:36px; height:36px; border-radius:50%; background:var(--edge); pointer-events:none; }
    #act { position:fixed; right:14px; bottom:calc(90px + env(safe-area-inset-bottom)); width:64px; height:64px; border-radius:50%; font-size:14px; z-index:4; }
    @media (max-width:600px) {
      /* auto-fit packs the nine controls into two rows on most phones and three at
         320px. The offsets below are sized for that three-row worst case, so the
         chat, panel and joystick never overlap the bar however it wraps. */
      #bar { left:8px; right:8px; display:grid; grid-template-columns:repeat(auto-fit,minmax(58px,1fr)); grid-auto-rows:30px; gap:3px; z-index:5; }
      #bar button { min-width:0; font-size:6px; padding:4px 2px; line-height:1.4; box-shadow:1px 1px 0 #000; }
      #chat { bottom:calc(108px + env(safe-area-inset-bottom)); width:calc(100% - 16px); height:28px; }
      #chatlog { bottom:calc(142px + env(safe-area-inset-bottom)); }
      #panel { bottom:calc(142px + env(safe-area-inset-bottom)); max-height:clamp(100px,calc(100dvh - 300px),60vh); }
      #joy, #act { bottom:calc(146px + env(safe-area-inset-bottom)); }
    }
    .t-common{color:#c8c8c8}.t-uncommon{color:#6cd46c}.t-rare{color:#4aa3ff}.t-epic{color:#c26bff}.t-legendary{color:#ffb02e}.t-mythic{color:#ff4d6d}
    .m-golden{color:#ffd24a}.m-holographic{color:#8ff}.m-colossal{color:#f8a}.m-feral{color:#8f8}.m-backwards{color:#aaf}.m-screaming{color:#f55}
  /* Ticker tape. Pinned top-centre, above the world, below every panel. */
  #tape{position:fixed;top:0;left:0;right:0;z-index:6;pointer-events:none;font-size:9px;line-height:1.5;
    background:linear-gradient(#0b0908ee,#0b0908cc);border-bottom:2px solid #3a2e24;text-shadow:1px 1px 0 #000}
  #tape-top{display:flex;gap:10px;align-items:baseline;padding:3px 8px 1px}
  #tape-season{color:#f0c040;white-space:nowrap;flex:none}
  #tape-head{color:#d9c9a8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  #tape-credit{color:#8a7d6a;white-space:nowrap;flex:none;margin-left:auto;letter-spacing:.5px}
  #tape-strip{overflow:hidden;padding:0 0 3px}
  #tape-row{display:inline-flex;gap:14px;white-space:nowrap;padding-left:8px;animation:tape 42s linear infinite}
  .tk{flex:none;letter-spacing:.5px}
  .tk.up{color:#8cd25a}.tk.down{color:#e06666}.tk.flat{color:#8a7d6a}
  @keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (max-width:900px){#tape-head{display:none}}
  @media (max-width:600px){#tape{font-size:8px}#tape-credit{display:none}}
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="status-stack">
  <div id="hud"><div class="dim">OFFICIAL LAUNCH</div><div><span class="sap" id="sap">0</span> <span class="dim">Sap</span> <span class="dim"><span id="sps">0</span>/s · <span id="plots">0/6</span></span></div><div class="dim" id="village"></div><div id="carry" hidden></div></div>
  <div id="tape" hidden><div id="tape-top"><span id="tape-season"></span><span id="tape-head"></span><span id="tape-credit">built with the help of ELIZA</span></div><div id="tape-strip"><div id="tape-row"></div></div></div>
  <div id="feed"></div>
  <div id="banner" hidden></div>
  <div id="toast"></div>
  </div>
  <div id="chatlog"></div>
  <input id="chat" maxlength="80" autocomplete="off" />
  <div id="joy" hidden><div id="joy-knob"></div></div>
  <button id="act" hidden>E</button>
  <div id="bar">
    <button id="btn-daily" title="Daily reward, opens at noon Pacific">Daily</button>
    <button data-panel="conveyor" id="btn-conveyor">Conveyor</button>
    <button data-panel="seeds" id="btn-seeds">Bag</button>
    <button data-panel="shop" id="btn-shop">Shop</button>
    <button data-panel="feed" id="btn-feed">Feed</button>
    <button data-panel="emotes" id="btn-emotes">Emotes</button>
    <button data-panel="land" id="btn-land">Land</button>
    <button data-panel="odds" id="btn-odds">Odds</button>
    <button id="btn-zoom">Zoom</button>
    <button id="btn-mute">♪</button>
  </div>
  <div id="panel" hidden><h2><span id="panel-title"></span><button id="panel-close">X</button></h2><div id="panel-body"></div></div>
  <div id="modal" hidden><div class="card" id="modal-card"></div></div>
  <div id="name-modal" hidden><div class="card"><h3 id="name-title"></h3><input id="name-input" maxlength="16" autocomplete="off" /><div id="wallets"></div><p class="note" id="name-hint"></p><p class="note" id="name-or"></p><button id="name-go"></button></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
