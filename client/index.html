<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Pons Garden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#181220; --panel:#2a1f33; --panel2:#3a2c45; --edge:#bc8c5a; --text:#f0e8d2; --sap:#f0c434; --dim:#a898b8; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; height:100%; background:var(--ink); color:var(--text); font-family:'Press Start 2P', monospace; font-size:10px; overflow:hidden; touch-action:none; }
    #game { position:fixed; inset:0; }
    #game canvas { image-rendering:pixelated; image-rendering:crisp-edges; }
    button { font-family:inherit; font-size:10px; color:var(--text); background:var(--panel2); border:2px solid var(--edge); padding:8px 10px; cursor:pointer; box-shadow:2px 2px 0 #000; }
    button:active { transform:translate(1px,1px); box-shadow:1px 1px 0 #000; }
    button:disabled { opacity:.45; cursor:default; }
    #hud { position:fixed; top:8px; left:8px; background:rgba(24,18,32,.85); border:2px solid var(--edge); padding:8px 10px; line-height:1.8; pointer-events:none; }
    #hud .sap { color:var(--sap); }
    #hud .dim { color:var(--dim); font-size:8px; }
    #bar { position:fixed; bottom:calc(8px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); display:flex; gap:6px; }
    #panel { position:fixed; left:50%; bottom:calc(52px + env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(96vw,560px); max-height:70vh; overflow:auto; background:var(--panel); border:3px solid var(--edge); box-shadow:4px 4px 0 #000; padding:10px; }
    #panel[hidden] { display:none; }
    #panel h2 { margin:0 0 8px; font-size:11px; display:flex; justify-content:space-between; align-items:center; }
    #panel h2 button { padding:4px 8px; }
    .slots { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; }
    .slot { background:var(--panel2); border:2px solid #000; padding:6px; display:grid; grid-template-columns:36px 1fr; gap:6px; align-items:center; }
    .slot.sold { opacity:.4; }
    .icon { width:32px; height:48px; background-image:url('sprites/plants.png'); background-repeat:no-repeat; image-rendering:pixelated; }
    .slot .name { font-size:8px; line-height:1.5; }
    .slot .tier { font-size:7px; }
    .slot .buy { grid-column:1 / -1; display:flex; justify-content:space-between; align-items:center; }
    .price { color:var(--sap); }
    .seeds { display:flex; flex-wrap:wrap; gap:8px; }
    .seed { background:var(--panel2); border:2px solid #000; padding:6px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; width:100px; font-size:7px; text-align:center; }
    .seed.sel { border-color:var(--sap); }
    .row { display:flex; justify-content:space-between; padding:3px 0; font-size:8px; }
    .note { color:var(--dim); font-size:7px; line-height:1.6; margin-top:8px; }
    #toast { position:fixed; top:8px; left:50%; transform:translateX(-50%); background:rgba(24,18,32,.92); border:2px solid var(--edge); padding:8px 12px; font-size:8px; max-width:80vw; text-align:center; transition:opacity .3s; opacity:0; pointer-events:none; line-height:1.6; }
    #toast.on { opacity:1; }
    #modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; }
    #modal[hidden] { display:none; }
    #modal .card { background:var(--panel); border:3px solid var(--sap); box-shadow:6px 6px 0 #000; padding:16px; width:min(92vw,360px); text-align:center; }
    #modal .card .icon { margin:8px auto 60px; transform:scale(2); transform-origin:center top; }
    #modal .card h3 { font-size:11px; margin:6px 0; line-height:1.6; }
    #modal .card p { font-size:8px; margin:4px 0; line-height:1.7; }
    .t-common{color:#c8c8c8}.t-uncommon{color:#6cd46c}.t-rare{color:#4aa3ff}.t-epic{color:#c26bff}.t-legendary{color:#ffb02e}.t-mythic{color:#ff4d6d}
    .m-golden{color:#ffd24a}.m-holographic{color:#8ff}.m-colossal{color:#f8a}.m-feral{color:#8f8}.m-backwards{color:#aaf}.m-screaming{color:#f55}
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="hud"><div><span class="sap" id="sap">0</span> <span class="dim">Sap</span></div><div class="dim"><span id="sps">0</span> Sap/s · <span id="plots">0/6</span> plots</div></div>
  <div id="toast"></div>
  <div id="bar">
    <button data-panel="conveyor" id="btn-conveyor">Seeds</button>
    <button data-panel="seeds" id="btn-seeds">Bag</button>
    <button data-panel="shop" id="btn-shop">Sprint</button>
    <button data-panel="odds" id="btn-odds">Odds</button>
  </div>
  <div id="panel" hidden><h2><span id="panel-title"></span><button id="panel-close">X</button></h2><div id="panel-body"></div></div>
  <div id="modal" hidden><div class="card" id="modal-card"></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
